<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PikselDünyası🇹🇷</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bar:#1b1f2a;--ink:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b3a66;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%}
.row{position:fixed;left:8px;right:8px;display:flex;gap:8px;align-items:center;font-size:14px}
.row>*{background:var(--bar);border-radius:8px;color:var(--ink);border:0}
#top{top:calc(env(safe-area-inset-top,0px) + 8px)}
#tools{top:calc(env(safe-area-inset-top,0px) + 58px)}
.row button{padding:8px 12px;font-size:15px}
#timer{flex:1;padding:6px 12px;position:relative;overflow:hidden}
#timer b{font-size:22px;font-variant-numeric:tabular-nums}
#rate{font-size:12px;opacity:.7;margin-left:6px}
#bar{position:absolute;left:0;bottom:0;height:4px;background:#ff9800;width:0}
.plus{position:absolute;right:10px;top:6px;color:#ff3b30;font-weight:900;font-size:15px;pointer-events:none;animation:up .9s forwards}
@keyframes up{from{opacity:1;transform:translateY(10px)}to{opacity:0;transform:translateY(-14px)}}
#info{padding:8px 10px;max-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button.on{background:#e50000!important}
#pal{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);display:grid;grid-template-rows:repeat(2,34px);grid-auto-flow:column;grid-auto-columns:34px;gap:6px;overflow-x:auto;touch-action:pan-x}
#pal b{width:34px;height:34px;border-radius:6px;border:3px solid transparent}
#pal b.on{border-color:#fff}
#bn{position:fixed;left:50%;top:110px;transform:translateX(-50%);max-width:92%;padding:10px 14px;border-radius:12px;font-weight:800;text-align:center;display:none;z-index:30;color:#fff;background:#d50000;box-shadow:0 4px 18px #000a}
.pop{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#e50000;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;z-index:29;pointer-events:none;animation:pp 1.1s forwards}
@keyframes pp{0%{transform:scale(.3);opacity:1}30%{transform:scale(1.3)}100%{transform:scale(1);opacity:0}}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;touch-action:auto}
.card{background:#1b1f2a;padding:20px;border-radius:14px;width:min(320px,88%);text-align:center}
.card input{width:100%;font-size:16px;padding:10px;margin:6px 0;border-radius:8px;border:0}
.card button{padding:10px 16px;margin:4px;border:0;border-radius:8px;font-size:15px;background:#1976d2;color:#fff}
.card button.g{background:#444}
#lerr{color:#ff8a80;min-height:20px;font-size:13px}

        else if(inb(lo,la,74,100,28,37)||inb(lo,la,-72,-66,-40,-15)||inb(lo,la,-125,-105,36,52)){r=142;g=128;b=108;}
        else if(Math.abs(la)<12){r=34;g=120;b=52;}else if(la>52){r=58;g=112;b=72;}else if(Math.abs(la)<30){r=98;g=152;b=64;}else{r=112;g=160;b=78;}
        d32[i]=rgb(r+n,g+n,b+n);
      }else{
        var near=0;for(var k=1;k<=3&&!near;k++){if((x>=k&&isL[i-k])||(x<NX-k&&isL[i+k])||(y>=k&&isL[i-k*NX])||(y<NY-k&&isL[i+k*NX]))near=k;}
        d32[i]=near==1?cSh:near>1?cMid:(Math.abs(la)<60?cOc:cDp);
      }}}
    $('lp').textContent=Math.round(y/NY*100)+'%';
    if(y<NY)setTimeout(chunk,0);else{og.putImageData(img,0,0);done();}
  }
  chunk();
}
function fatal(t){$('load').style.display='flex';$('lerr2').textContent=t;}
window.onerror=function(m){fatal('Hata: '+m);};
var me=null,tok=null,cd=0,tPrev=Date.now(),cur=5,pen=false,fast=false,s=1,ox=0,oy=0,W,H,es=null;
var cv=$('c'),g=cv.getContext('2d');
var BASE='',offline=false,local={},FILE=location.protocol.indexOf('http')!==0;try{BASE=localStorage.getItem('srv')||'';}catch(e){}
function U(p){return BASE?BASE+'/'+p:p;}
function api(path,method,obj){
  var h={'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
  return fetch(U(path),{method:method||'GET',headers:h,body:obj?JSON.stringify(obj):undefined}).then(function(r){return r.json().then(function(j){j._s=r.status;return j;});});
}
function toast(t,ms){var b=$('bn');b.textContent=t;b.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){b.style.display='none'},ms||2500);}
var ac=null;
function ditt(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var oo=ac.createOscillator(),gg=ac.createGain();oo.type='square';oo.frequency.value=300;gg.gain.value=.15;oo.connect(gg);gg.connect(ac.destination);oo.start();oo.stop(ac.currentTime+.2);}catch(e){}}
var lastW=0;
function seaWarn(cx,cy){
  var n=Date.now();if(n-lastW<1500)return;lastW=n;
  var p=document.createElement('div');p.className='pop';p.textContent='❗';p.style.left=cx+'px';p.style.top=cy+'px';document.body.appendChild(p);setTimeout(function(){p.remove()},1200);
  ditt();toast('❗ UYARI SADECE TOPRAK OLAN YERLERE KOYA BİLİRSİNİZ',2600);
}
function plusFx(n){var e=document.createElement('span');e.className='plus';e.textContent='+'+n;$('timer').appendChild(e);setTimeout(function(){e.remove()},950);}
function setAdd(a,announce){if(a===ADD)return;ADD=a;ui();if(announce)toast((a<10?'⚡ Hızlı: ':'⏱️ Normal: ')+'piksel başı artık +'+a+' sn',2500);}
function fit(){var r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;g.setTransform(r,0,0,r,0,0);draw();}
function draw(){
  g.fillStyle='#0b3a66';g.fillRect(0,0,W,H);
  g.imageSmoothingEnabled=s<1.5;g.drawImage(o,ox,oy,NX*s,NY*s);
  if(s>=10){g.strokeStyle='#0002';g.beginPath();var x0=Math.max(0,Math.floor(-ox/s)),x1=Math.min(NX,Math.ceil((W-ox)/s)),y0=Math.max(0,Math.floor(-oy/s)),y1=Math.min(NY,Math.ceil((H-oy)/s));
    for(var k=x0;k<=x1;k++){g.moveTo(ox+k*s,oy+y0*s);g.lineTo(ox+k*s,oy+y1*s);}for(k=y0;k<=y1;k++){g.moveTo(ox+x0*s,oy+k*s);g.lineTo(ox+x1*s,oy+k*s);}g.stroke();}
}
var dirty=false;function rd(){if(!dirty){dirty=true;requestAnimationFrame(function(){dirty=false;draw();});}}
function zoom(f,cx,cy){var n=Math.max(.12,Math.min(40,s*f));ox=cx-(cx-ox)*n/s;oy=cy-(cy-oy)*n/s;s=n;draw();}
function setPx(x,y,v){og.fillStyle=cols[v-1];og.fillRect(x,y,1,1);}
var lastCell=-1;
function tryPlace(cx,cy){
  if(!me)return;
  var x=Math.floor((cx-ox)/s),y=Math.floor((cy-oy)/s);if(x<0||y<0||x>=NX||y>=NY)return;
  var id=y*NX+x;
  if(!isL[id]){seaWarn(cx,cy);return;}
  if((pen||fast)&&id===lastCell)return;lastCell=id;
  if(cd+ADD>MAX)return;
  setPx(x,y,cur+1);cd+=ADD;plusFx(ADD);rd();ui();
  if(offline){local[id]=cur+1;try{localStorage.setItem('pxo2',JSON.stringify(local));}catch(e){}return;}
  api('api/pixel','POST',{x:x,y:y,c:cur}).then(function(j){
    if(typeof j.cd==='number'){cd=j.cd;ui();}
    if(typeof j.add==='number')setAdd(j.add,true);
  }).catch(function(){});
}
function ui(){
  if(!me)return;
  var t=Math.ceil(cd);$('tm').textContent=Math.floor(t/60)+':'+('0'+t%60).slice(-2);
  $('bar').style.width=(cd/MAX*100)+'%';$('rate').textContent='(+'+ADD+' sn)';$('info').textContent=me.name;
}
setInterval(function(){var n=Date.now();cd=Math.max(0,cd-(n-tPrev)/1000);tPrev=n;ui();},250);
var P={},moved=false,holdT=0,px0=0,py0=0;
function paintTo(x1,y1){var dx=x1-px0,dy=y1-py0,dd=Math.hypot(dx,dy),st=Math.min(80,Math.max(1,Math.ceil(dd/Math.max(1,s*.5))));for(var i=1;i<=st;i++)tryPlace(px0+dx*i/st,py0+dy*i/st);px0=x1;py0=y1;}
function endHold(){clearTimeout(holdT);fast=false;}
cv.addEventListener('pointerdown',function(e){
  if(!me)return;cv.setPointerCapture(e.pointerId);P[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;lastCell=-1;
  if(Object.keys(P).length>1){endHold();return;}
  px0=e.clientX;py0=e.clientY;
  if(pen){tryPlace(e.clientX,e.clientY);return;}
  clearTimeout(holdT);holdT=setTimeout(function(){if(!moved&&P[e.pointerId]&&Object.keys(P).length==1){fast=true;lastCell=-1;toast('⚡ Hızlı mod',1500);tryPlace(px0,py0);}},2500);
});
cv.addEventListener('pointermove',function(e){
  var p=P[e.pointerId];if(!p)return;var ids=Object.keys(P);
  if((pen||fast)&&ids.length==1){p.x=e.clientX;p.y=e.clientY;paintTo(e.clientX,e.clientY);return;}
  if(ids.length==1){var dx=e.clientX-p.x,dy=e.clientY-p.y;if(moved||Math.abs(dx)+Math.abs(dy)>3){moved=true;ox+=dx;oy+=dy;p.x=e.clientX;p.y=e.clientY;draw();}}
  else if(ids.length==2){moved=true;var q=P[ids[0]==e.pointerId?ids[1]:ids[0]];var d0=Math.hypot(p.x-q.x,p.y-q.y);p.x=e.clientX;p.y=e.clientY;var d1=Math.hypot(p.x-q.x,p.y-q.y);if(d0>0)zoom(d1/d0,(p.x+q.x)/2,(p.y+q.y)/2);}
});
cv.addEventListener('pointerup',function(e){var wasP=pen||fast;endHold();if(P[e.pointerId]&&!moved&&!wasP&&Object.keys(P).length==1)tryPlace(e.clientX,e.clientY);delete P[e.pointerId];});
cv.addEventListener('pointercancel',function(e){endHold();delete P[e.pointerId];});
cv.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY<0?1.15:.87,e.clientX,e.clientY);},{passive:false});
$('zi').onclick=function(){zoom(1.4,W/2,H/2)};$('zo').onclick=function(){zoom(.71,W/2,H/2)};
$('pen').onclick=function(){pen=!pen;this.className=pen?'on':'';};
var pal=$('pal');cols.forEach(function(c,i){var b=document.createElement('b');b.style.background=c;if(i==cur)b.className='on';b.onclick=function(){cur=i;[].forEach.call(pal.children,function(x){x.className=''});b.className='on';};pal.appendChild(b);});
function connect(){
  if(es)return;es=new EventSource(U('api/events'));
  es.onmessage=function(ev){var m=JSON.parse(ev.data);
    if(m.t==='p'){setPx(m.x,m.y,m.v);rd();}else if(m.t==='a')setAdd(m.add,true);};
}
function start(){
  api('api/init').then(function(j){
    if(!j.me){$('login').style.display='flex';$('lerr').textContent='Hata';return;}
    me=j.me;cd=me.cd;tPrev=Date.now();setAdd(j.add||10,false);$('login').style.display='none';ui();
    fetch(U('api/map')).then(function(r){return r.arrayBuffer();}).then(function(b){var a=new Uint8Array(b);if(a.length!==NX*NY)return;for(var i=0;i<a.length;i++)if(a[i]){og.fillStyle=cols[a[i]-1];og.fillRect(i%NX,(i/NX)|0,1,1);}rd();connect();});
  }).catch(function(){$('lerr').textContent='Sunucuya bağlanılamadı. Sunucu adresini yaz ya da çevrimdışı oyna';$('sv').style.display='block';$('bo').style.display='inline-block';$('sv').value=BASE;$('login').style.display='flex';});
}
function go(){
  if(FILE||$('sv').value.trim()){var v=$('sv').value.trim().replace(/\/+$/,'');if(!v){$('lerr').textContent='Sunucu adresi yaz ya da çevrimdışı oyna';return;}if(!/^https?:\/\//.test(v))v='https://'+v;BASE=v;try{localStorage.setItem('srv',v);}catch(e){}}
  start();
}
function startOffline(){
  offline=true;me={name:'Misafir',cd:0};cd=0;$('login').style.display='none';
  try{local=JSON.parse(localStorage.getItem('pxo2')||'{}');}catch(e){local={};}
  for(var k in local){var i=+k;setPx(i%NX,(i/NX)|0,local[k]);}
  var R=[2,5,10,10,10];(function rot(){setTimeout(function(){setAdd(R[Math.floor(Math.random()*R.length)],true);rot();},60000+Math.random()*120000);})();
  ui();rd();toast('📴 Çevrimdışı mod: sadece sen çizersin',3500);
}
$('bo').onclick=startOffline;$('bl').onclick=go;
try{tok=localStorage.getItem('did');}catch(e){}
if(!tok){tok=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){return(b%36).toString(36)}).join('');try{localStorage.setItem('did',tok);}catch(e){}}
addEventListener('resize',fit);
fit();s=Math.max(.12,W/NX*1.6);ox=-(-68.5+180)/360*NX*s+W/2;oy=-(90+53.5)/180*NY*s+H/2;
setTimeout(function(){
  if(typeof GEO==='undefined'){fatal('geo.js yüklenemedi.');return;}
  genBase(function(){$('load').style.display='none';draw();
    if(FILE){$('sv').value=BASE;if(BASE)start();else $('login').style.display='flex';}else start();});
},30);
</script>
